services:
  db:
    image: mysql:latest
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=clinica
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=1234
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  dbadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - db
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    env_file:
      - .env
    
    
volumes:
  db_data: